spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

lesson55:
  store:
    initialize-schema: false

# Production fails fast if the shared datasource variables are missing.
# Schema creation is owned by migration tooling; see db/mysql/001_create_lesson55_request_store.sql.
