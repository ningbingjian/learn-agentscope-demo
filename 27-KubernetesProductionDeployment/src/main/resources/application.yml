server:
  port: 18081
  shutdown: graceful

spring:
  application:
    name: 27-KubernetesProductionDeployment
  lifecycle:
    timeout-per-shutdown-phase: 40s

deployment:
  redis-url: ${REDIS_URL:}

agentscope:
  model:
    provider: dashscope
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
    model-name: qwen-plus
    stream: true
  admin:
    enabled: true
    write-enabled: true
    write-token: ${AGENTSCOPE_ADMIN_TOKEN:local-demo-token}

management:
  server:
    port: 18082
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,agentScopeReadiness
  endpoints:
    web:
      exposure:
        include: health,info,agentscope-status,agentscope-drain
